<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페인 & 심박동 시뮬레이터</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f3f4f6;
        }

        /* 심장 박동 애니메이션 키프레임 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .heart-animate {
            display: inline-block;
            /* 초기 속도는 JS에서 덮어씌워집니다 (기본 70BPM 기준 약 0.85s) */
            animation: heartbeat 0.85s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.5));
        }

        /* 3D 느낌의 버튼 호버 효과 */
        .btn-3d {
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #4f46e5;
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #4f46e5;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col">
        <!-- 헤더 영역 -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 sm:p-8 text-white text-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMTAiIGN5PSIxMCIgcj0iMiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==')]"></div>
            <h1 class="text-3xl sm:text-4xl font-bold relative z-10 flex items-center justify-center gap-3">
                <i class="fa-solid fa-bolt text-yellow-400"></i>
                나의 카페인 반응성 알아보기
            </h1>
            <p class="mt-3 text-indigo-100 relative z-10 text-sm sm:text-base">음료와 나의 체질을 선택하고 심박동의 변화를 관찰해 보세요!</p>
        </header>

        <main class="flex-1 p-6 sm:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- 좌측: 컨트롤 패널 (입력부) -->
            <div class="lg:col-span-4 flex flex-col gap-6 bg-gray-50 p-6 rounded-2xl border border-gray-100 shadow-inner">
                <div>
                    <label class="block text-gray-700 font-bold mb-3 text-lg">
                        <i class="fa-solid fa-cup-togo text-blue-500 mr-2"></i>1. 음료 선택
                    </label>
                    <select id="drinkSelect" class="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition outline-none text-gray-700 bg-white font-medium appearance-none">
                        <option value="200">☕ 메가커피 아메리카노 (카페인 약 200mg)</option>
                        <option value="100">🔋 몬스터 에너지 (카페인 약 100mg)</option>
                        <option value="60">⚡ 핫식스 (카페인 약 60mg)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-3 text-lg">
                        <i class="fa-solid fa-person text-green-500 mr-2"></i>2. 나의 카페인 체질
                    </label>
                    <select id="personSelect" class="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition outline-none text-gray-700 bg-white font-medium appearance-none">
                        <option value="normal">😐 일반인 (보통)</option>
                        <option value="sensitive">😵 카페인 민감형 (영향이 큼)</option>
                        <option value="insensitive">😎 카페인 둔감형 (영향이 적음)</option>
                    </select>
                </div>

                <div class="mt-auto pt-4">
                    <button id="runBtn" class="btn-3d w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl text-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> 시뮬레이션 시작
                    </button>
                </div>
            </div>

            <!-- 우측: 결과 출력 (그래프 및 일러스트) -->
            <div class="lg:col-span-8 flex flex-col gap-6">
                <!-- 심장 일러스트 및 현재 상태 -->
                <div class="bg-red-50 rounded-2xl p-6 border border-red-100 flex items-center justify-between sm:justify-around flex-wrap gap-4">
                    
                    <div class="flex items-center gap-6">
                        <!-- 심장 SVG 일러스트 -->
                        <div class="w-24 h-24 sm:w-32 sm:h-32 flex items-center justify-center">
                            <svg class="heart-animate text-red-500 w-full h-full" id="heartIcon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </div>
                        
                        <div>
                            <p class="text-gray-500 font-semibold mb-1">최고 심박수 (예측값)</p>
                            <div class="flex items-baseline gap-1">
                                <span class="text-5xl sm:text-6xl font-black text-red-600" id="bpmDisplay">70</span>
                                <span class="text-xl text-red-400 font-bold">BPM</span>
                            </div>
                            <p id="statusMsg" class="mt-2 text-sm font-medium text-gray-600 bg-white px-3 py-1 rounded-full border border-gray-200 shadow-sm inline-block">
                                평온한 상태입니다.
                            </p>
                        </div>
                    </div>

                </div>

                <!-- 그래프 영역 -->
                <div class="flex-1 bg-white border border-gray-200 rounded-2xl p-4 sm:p-6 shadow-sm min-h-[300px] relative">
                    <canvas id="heartRateChart"></canvas>
                </div>
            </div>

        </main>
    </div>

    <script>
        // 전역 변수 설정
        let chartInstance = null;
        const ctx = document.getElementById('heartRateChart').getContext('2d');
        const heartIcon = document.getElementById('heartIcon');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const statusMsg = document.getElementById('statusMsg');
        const runBtn = document.getElementById('runBtn');

        // 차트 그라데이션 효과 생성
        const gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
        gradientFill.addColorStop(0, 'rgba(239, 68, 68, 0.5)'); // Red-500
        gradientFill.addColorStop(1, 'rgba(239, 68, 68, 0.0)');

        // 차트 초기화 함수
        function initChart() {
            Chart.defaults.font.family = "'Pretendard', sans-serif";
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['섭취 전', '30분 후', '60분 후', '90분 후', '120분 후', '150분 후'],
                    datasets: [{
                        label: '심박수 변화 (BPM)',
                        data: [70, 70, 70, 70, 70, 70],
                        borderColor: '#ef4444', // Tailwind red-500
                        backgroundColor: gradientFill,
                        borderWidth: 4,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#ef4444',
                        pointBorderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        tension: 0.4, // 곡선 부드럽게
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false // 레전드 숨김
                        },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.9)',
                            titleFont: { size: 14 },
                            bodyFont: { size: 16, weight: 'bold' },
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' BPM';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 50,
                            max: 150,
                            grid: {
                                color: '#f3f4f6',
                                drawBorder: false,
                            },
                            ticks: {
                                font: { size: 12, weight: '600' },
                                color: '#6b7280'
                            }
                        },
                        x: {
                            grid: {
                                display: false,
                                drawBorder: false,
                            },
                            ticks: {
                                font: { size: 13, weight: '600' },
                                color: '#4b5563'
                            }
                        }
                    },
                    animation: {
                        duration: 1500,
                        easing: 'easeOutQuart'
                    }
                }
            });
        }

        // 시뮬레이션 계산 로직
        function runSimulation() {
            // 버튼 클릭 피드백 시각 효과
            runBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 분석 중...';
            runBtn.disabled = true;

            setTimeout(() => {
                const drinkCaffeine = parseInt(document.getElementById('drinkSelect').value);
                const personType = document.getElementById('personSelect').value;
                
                const baseBpm = 70;
                let dataPoints = [];
                
                // 카페인 100mg 기준을 1.0으로 환산
                const caffeineRatio = drinkCaffeine / 100; 

                // 체질에 따른 심박수 변화 커브 (100mg 섭취 시 기준)
                if (personType === 'sensitive') {
                    // 민감형: 급격히 오르고 천천히 떨어짐
                    dataPoints = [
                        baseBpm, 
                        baseBpm + (25 * caffeineRatio), 
                        baseBpm + (32 * caffeineRatio), // Peak (30~60분)
                        baseBpm + (28 * caffeineRatio), 
                        baseBpm + (22 * caffeineRatio), 
                        baseBpm + (15 * caffeineRatio)
                    ];
                } else if (personType === 'normal') {
                    // 일반형: 완만하게 오르고 적당히 떨어짐
                    dataPoints = [
                        baseBpm, 
                        baseBpm + (10 * caffeineRatio), 
                        baseBpm + (15 * caffeineRatio), // Peak
                        baseBpm + (10 * caffeineRatio), 
                        baseBpm + (5 * caffeineRatio), 
                        baseBpm
                    ];
                } else {
                    // 둔감형: 변화가 거의 없음
                    dataPoints = [
                        baseBpm, 
                        baseBpm + (2 * caffeineRatio), 
                        baseBpm + (4 * caffeineRatio), // Peak
                        baseBpm + (2 * caffeineRatio), 
                        baseBpm + (1 * caffeineRatio), 
                        baseBpm
                    ];
                }

                // 차트 업데이트
                chartInstance.data.datasets[0].data = dataPoints;
                chartInstance.update();

                // 최고 심박수 도출
                const maxBpm = Math.round(Math.max(...dataPoints));
                
                // 숫자 카운트업 애니메이션
                animateValue(bpmDisplay, parseInt(bpmDisplay.innerText), maxBpm, 1000);

                // 상태 메시지 업데이트
                updateStatusMessage(maxBpm);

                // 심장 애니메이션 속도 조절 (BPM 기준)
                // 60초 / BPM = 1번 뛰는데 걸리는 초
                const animationDuration = 60 / maxBpm;
                heartIcon.style.animationDuration = `${animationDuration}s`;

                // 버튼 원상복구
                runBtn.innerHTML = '<i class="fa-solid fa-play"></i> 시뮬레이션 시작';
                runBtn.disabled = false;

            }, 600); // 0.6초 딜레이로 계산하는 듯한 효과 연출
        }

        // 상태 메시지 분기 처리
        function updateStatusMessage(bpm) {
            statusMsg.className = "mt-2 text-sm font-bold px-4 py-1.5 rounded-full border shadow-sm inline-block ";
            if (bpm < 80) {
                statusMsg.innerText = "😌 평온하고 안정적인 상태입니다.";
                statusMsg.className += "bg-green-50 text-green-700 border-green-200";
            } else if (bpm < 100) {
                statusMsg.innerText = "🏃 약간의 흥분 상태 (가벼운 운동 수준)";
                statusMsg.className += "bg-yellow-50 text-yellow-700 border-yellow-200";
            } else if (bpm < 120) {
                statusMsg.innerText = "⚠️ 심박수가 높습니다. 두근거림이 느껴집니다.";
                statusMsg.className += "bg-orange-50 text-orange-700 border-orange-200";
            } else {
                statusMsg.innerText = "🚨 위험! 심박수가 매우 높습니다. (수면 장애 유발)";
                statusMsg.className += "bg-red-50 text-red-700 border-red-200 animate-pulse";
            }
        }

        // 숫자 카운트 애니메이션 유틸리티
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // easeOutQuad
                const easeProgress = progress * (2 - progress); 
                obj.innerHTML = Math.floor(easeProgress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        // 이벤트 리스너 등록
        runBtn.addEventListener('click', runSimulation);

        // 초기화 실행
        window.onload = initChart;
    </script>
</body>
</html>
